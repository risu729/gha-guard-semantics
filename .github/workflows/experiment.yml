name: Guard experiment
run-name: Guard experiment (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dependency outcome to produce
        required: true
        type: choice
        options:
          - failure
          - skipped
          - timeout
          - allowed-timeout
          - success
          - manual-cancel

permissions: {}

jobs:
  dependency:
    uses: ./.github/workflows/dependency.yml
    with:
      mode: ${{ inputs.mode }}

  always-contains:
    name: always + direct needs results
    needs: dependency
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  contains-only:
    name: direct needs results without always
    needs: dependency
    if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  status-functions:
    name: failure or cancelled
    needs: dependency
    if: failure() || cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  always-status-functions:
    name: always + failure or cancelled
    needs: dependency
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  not-cancelled-contains:
    name: not cancelled + direct needs results
    needs: dependency
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  failure-only:
    name: failure only (LayerOne baseline)
    needs: dependency
    if: failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  not-cancelled-explicit:
    name: not cancelled + explicit dependency result (LayerOne proposal)
    needs: dependency
    if: ${{ !cancelled() && (needs.dependency.result == 'failure' || needs.dependency.result == 'cancelled') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  dependency-report:
    name: Report dependency result
    needs: dependency
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: |
          echo "dependency=${{ needs.dependency.result }}"

  allowed-timeout:
    if: inputs.mode == 'allowed-timeout'
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: sleep 180

  allowed-timeout-guard:
    needs: allowed-timeout
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: exit 1

  allowed-timeout-report:
    needs:
      - allowed-timeout
      - allowed-timeout-guard
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: |
          echo "allowed-timeout=${{ needs.allowed-timeout.result }}"
          echo "allowed-timeout-guard=${{ needs.allowed-timeout-guard.result }}"
